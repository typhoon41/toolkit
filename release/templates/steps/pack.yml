# Install the SDKs and Node first. Embeds the release notes when release-notes.yml ran before.

parameters:
  - name: planFile
    type: string
    default: $(Build.ArtifactStagingDirectory)/release/release-plan.json
  - name: notesDirectory
    type: string
    default: $(Build.ArtifactStagingDirectory)/release/notes
  - name: packagesDirectory
    type: string
    default: $(Build.ArtifactStagingDirectory)/release/packages
  - name: configuration
    type: string
    default: Release
  - name: toolkitPath
    type: string
    default: $(Pipeline.Workspace)/toolkit

steps:
  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/New-ReleasePackage.ps1" `
        -PlanFile $env:PLAN_FILE `
        -OutDirectory $env:PACKAGES_DIRECTORY `
        -NotesDirectory $env:NOTES_DIRECTORY `
        -RepositoryUrl "https://github.com/$env:BUILD_REPOSITORY_NAME" `
        -Configuration $env:BUILD_CONFIGURATION
    displayName: Pack
    workingDirectory: $(Build.SourcesDirectory)
    target:
      commands: restricted
      settableVariables: []
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      PLAN_FILE: ${{ parameters.planFile }}
      NOTES_DIRECTORY: ${{ parameters.notesDirectory }}
      PACKAGES_DIRECTORY: ${{ parameters.packagesDirectory }}
      BUILD_CONFIGURATION: ${{ parameters.configuration }}
