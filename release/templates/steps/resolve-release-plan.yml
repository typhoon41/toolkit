# Output variables: <stepName>.HasRelease, <stepName>.RunName and <stepName>.RunNameCounted, e.g.
# dependencies.<Stage>.outputs['<Job>.ReleasePlan.HasRelease'].

parameters:
  - name: pipelineVersion          # application units only, e.g. $(Build.BuildNumber)
    type: string
    default: ''
  - name: releaseBranch
    type: string
    default: refs/heads/main
  - name: releaseDirectory         # receives release-plan.json; published as the 'release' artifact
    type: string
    default: $(Build.ArtifactStagingDirectory)/release
  - name: publishPlan              # publish the 'release' artifact right away (applications); package-release.yml publishes it later
    type: boolean
    default: false
  - name: keepRunName
    type: boolean
    default: false
  - name: toolkitPath
    type: string
    default: $(Pipeline.Workspace)/toolkit

steps:
  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/Resolve-ReleasePlan.ps1" `
        -SourceBranch $env:BUILD_SOURCEBRANCH `
        -BuildId $env:BUILD_BUILDID `
        -ReleaseBranch $env:RELEASE_BRANCH `
        -PullRequestSourceBranch $env:PULL_REQUEST_SOURCE_BRANCH `
        -PipelineVersion $env:PIPELINE_VERSION `
        -OutFile (Join-Path $env:RELEASE_DIRECTORY 'release-plan.json') `
        -KeepRunName:([bool]::Parse($env:KEEP_RUN_NAME))
    name: ReleasePlan
    displayName: Resolve release plan
    workingDirectory: $(Build.SourcesDirectory)
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      RELEASE_BRANCH: ${{ parameters.releaseBranch }}
      RELEASE_DIRECTORY: ${{ parameters.releaseDirectory }}
      PULL_REQUEST_SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
      PIPELINE_VERSION: ${{ parameters.pipelineVersion }}
      KEEP_RUN_NAME: ${{ parameters.keepRunName }}

  - ${{ if parameters.publishPlan }}:
    - publish: ${{ parameters.releaseDirectory }}
      artifact: release
      displayName: Publish release plan
