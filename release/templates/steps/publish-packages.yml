# Pushes the packages of every releasing NuGet and npm unit. Idempotent; safe with "Rerun failed jobs".
# It doesn't authenticate by itself: run authenticate-feeds.yml earlier in the job for Azure Artifacts
# feeds (step order: release/README.md, "Using the step templates on their own").
#   nuget.org:       variable NuGetApiKey (secret)
#   Azure Artifacts: authenticate-feeds.yml with nugetAuthenticate: true (the API key is then irrelevant)
#   npmjs.org:       variable NpmToken (secret, an automation token)
#   Azure Artifacts: authenticate-feeds.yml and here npmAuthenticate: true with the same npmrcFile

parameters:
  - name: releaseDirectory
    type: string
    default: $(Pipeline.Workspace)/release
  - name: nugetApiKey
    type: string
    default: $(NuGetApiKey)
  - name: npmToken
    type: string
    default: $(NpmToken)
  - name: npmAuthenticate          # use the .npmrc authenticate-feeds.yml prepared instead of NpmToken
    type: boolean
    default: false
  - name: npmrcFile
    type: string
    default: $(Build.SourcesDirectory)/.npmrc
  - name: npmAccess                # '', public or restricted (scoped packages on npmjs.org default to restricted)
    type: string
    default: ''
  - name: trustedFeedHosts         # comma-separated feed hosts besides nuget.org/npmjs.org/Azure Artifacts that may get API keys
    type: string
    default: ''
  - name: toolkitPath
    type: string
    default: $(Pipeline.Workspace)/toolkit

steps:
  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/Publish-NuGetPackage.ps1" `
        -PlanFile (Join-Path $env:RELEASE_DIRECTORY 'release-plan.json') `
        -PackagesPath (Join-Path $env:RELEASE_DIRECTORY 'packages') `
        -TrustedFeedHost $env:TRUSTED_FEED_HOSTS
    displayName: Push NuGet packages
    target:
      commands: restricted
      settableVariables: []
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      RELEASE_DIRECTORY: ${{ parameters.releaseDirectory }}
      TRUSTED_FEED_HOSTS: ${{ parameters.trustedFeedHosts }}
      NUGET_API_KEY: ${{ parameters.nugetApiKey }}
      NUGET_FEED_READ_TOKEN: $(System.AccessToken)

  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/Publish-NpmPackage.ps1" `
        -PlanFile (Join-Path $env:RELEASE_DIRECTORY 'release-plan.json') `
        -PackagesPath (Join-Path $env:RELEASE_DIRECTORY 'packages') `
        -Access $env:NPM_ACCESS `
        -TrustedFeedHost $env:TRUSTED_FEED_HOSTS
    displayName: Publish npm packages
    target:
      commands: restricted
      settableVariables: []
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      RELEASE_DIRECTORY: ${{ parameters.releaseDirectory }}
      TRUSTED_FEED_HOSTS: ${{ parameters.trustedFeedHosts }}
      NPM_ACCESS: ${{ parameters.npmAccess }}
      ${{ if parameters.npmAuthenticate }}:
        NPM_CONFIG_USERCONFIG: ${{ parameters.npmrcFile }}
      ${{ else }}:
        NPM_TOKEN: ${{ parameters.npmToken }}
