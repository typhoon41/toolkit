# After the production deployment, in a deployment job whose environment has an Exclusive lock (and lockBehavior:
# sequential), so two runs never release out of order. The Build stage must run resolve-release-plan.yml with
# pipelineVersion and publishPlan: true.

parameters:
  - name: releaseNotes
    type: boolean
    default: true
  - name: checkout                 # false when the job already ran steps/checkout.yml
    type: boolean
    default: true
  - name: githubToken              # Contents: write
    type: string
    default: $(GitHubToken)
  - name: toolkitRepository
    type: string
    default: toolkit
  - name: toolkitPath
    type: string
    default: $(Pipeline.Workspace)/toolkit

steps:
  - ${{ if parameters.checkout }}:
    - template: checkout.yml
      parameters:
        toolkitRepository: ${{ parameters.toolkitRepository }}

  - download: current
    artifact: release
    displayName: Download release plan

  - ${{ if parameters.releaseNotes }}:
    - template: release-notes.yml
      parameters:
        planFile: $(Pipeline.Workspace)/release/release-plan.json
        notesDirectory: $(Pipeline.Workspace)/release/notes
        githubToken: ${{ parameters.githubToken }}
        toolkitPath: ${{ parameters.toolkitPath }}

  - template: publish-github-release.yml
    parameters:
      action: Publish
      githubToken: ${{ parameters.githubToken }}
      toolkitPath: ${{ parameters.toolkitPath }}
