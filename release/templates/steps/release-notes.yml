# Optional: without it packages carry no notes and GitHub releases get a minimal body. Needs only read access.

parameters:
  - name: planFile
    type: string
    default: $(Build.ArtifactStagingDirectory)/release/release-plan.json
  - name: notesDirectory
    type: string
    default: $(Build.ArtifactStagingDirectory)/release/notes
  - name: githubToken              # e.g. $(GitHubReadToken); an undefined variable means anonymous access
    type: string
    default: $(GitHubReadToken)
  - name: useGitHubServiceConnection   # release jobs only: the Build stage runs PR code, so it never persists credentials
    type: boolean
    default: false
  - name: toolkitPath
    type: string
    default: $(Build.SourcesDirectory)/toolkit

steps:
  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/New-ReleaseNotes.ps1" `
        -PlanFile $env:PLAN_FILE `
        -OutDirectory $env:NOTES_DIRECTORY `
        -Repository $env:BUILD_REPOSITORY_NAME `
        -UseCheckoutCredentials:([bool]::Parse($env:USE_CHECKOUT_CREDENTIALS))
    displayName: Generate release notes
    target:
      commands: restricted
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      PLAN_FILE: ${{ parameters.planFile }}
      NOTES_DIRECTORY: ${{ parameters.notesDirectory }}
      USE_CHECKOUT_CREDENTIALS: ${{ parameters.useGitHubServiceConnection }}
      ${{ if not(parameters.useGitHubServiceConnection) }}:
        GITHUB_TOKEN: ${{ parameters.githubToken }}
