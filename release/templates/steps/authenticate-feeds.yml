# Authenticates to Azure Artifacts feeds. Run it before any step that reads or writes a feed: the GitHub
# release phases check the feeds (Prepare, Publish) and publish-packages.yml pushes to them.
#   nugetAuthenticate: NuGetAuthenticate@1 (pushes; feed reads use $(System.AccessToken))
#   npmAuthenticate:   npmAuthenticate@0 writes credentials into npmrcFile, an .npmrc that names the feed;
#                      pass the same npmAuthenticate/npmrcFile to the later steps so npm uses that file

parameters:
  - name: nugetAuthenticate
    type: boolean
    default: false
  - name: npmAuthenticate
    type: boolean
    default: false
  - name: npmrcFile
    type: string
    default: $(Build.SourcesDirectory)/.npmrc

steps:
  - ${{ if parameters.nugetAuthenticate }}:
    - task: NuGetAuthenticate@1
      displayName: Authenticate to NuGet feeds

  - ${{ if parameters.npmAuthenticate }}:
    - task: npmAuthenticate@0
      displayName: Authenticate to npm feeds
      inputs:
        workingFile: ${{ parameters.npmrcFile }}
