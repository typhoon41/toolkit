# Prepare runs before the feed push, Publish after it (creates the tag). Needs a token with Contents: write.

parameters:
  - name: action
    type: string
    values: [ Prepare, Publish ]
  - name: releaseDirectory         # the downloaded 'release' artifact
    type: string
    default: $(Pipeline.Workspace)/release
  - name: githubToken
    type: string
    default: $(GitHubToken)
  - name: useGitHubServiceConnection   # instead of githubToken: the toolkit resource's endpoint (checkout.yml persistToolkitCredentials)
    type: boolean
    default: false
  - name: feedWaitMinutes          # Publish: how long to wait for the feed to index the pushed packages
    type: number
    default: 15
  - name: npmToken                 # reads private npm registries; npmjs.org needs nothing
    type: string
    default: $(NpmToken)
  - name: npmAuthenticate          # read npm feeds with the .npmrc authenticate-feeds.yml prepared instead
    type: boolean
    default: false
  - name: npmrcFile
    type: string
    default: $(System.DefaultWorkingDirectory)/.npmrc
  - name: trustedFeedHosts         # comma-separated npm hosts besides npmjs.org/Azure Artifacts that may get NpmToken
    type: string
    default: ''
  - name: toolkitPath
    type: string
    default: $(Build.SourcesDirectory)/toolkit

steps:
  - pwsh: |
      & "$env:TOOLKIT_PATH/release/scripts/Publish-GitHubRelease.ps1" `
        -Action $env:RELEASE_ACTION `
        -PlanFile (Join-Path $env:RELEASE_DIRECTORY 'release-plan.json') `
        -PackagesPath (Join-Path $env:RELEASE_DIRECTORY 'packages') `
        -NotesDirectory (Join-Path $env:RELEASE_DIRECTORY 'notes') `
        -Repository $env:BUILD_REPOSITORY_NAME `
        -FeedWaitMinutes ([int]$env:FEED_WAIT_MINUTES) `
        -TrustedFeedHost $env:TRUSTED_FEED_HOSTS `
        -UseCheckoutCredentials:([bool]::Parse($env:USE_CHECKOUT_CREDENTIALS))
    displayName: ${{ parameters.action }} GitHub release
    target:
      commands: restricted
    env:
      TOOLKIT_PATH: ${{ parameters.toolkitPath }}
      RELEASE_ACTION: ${{ parameters.action }}
      RELEASE_DIRECTORY: ${{ parameters.releaseDirectory }}
      USE_CHECKOUT_CREDENTIALS: ${{ parameters.useGitHubServiceConnection }}
      ${{ if not(parameters.useGitHubServiceConnection) }}:
        GITHUB_TOKEN: ${{ parameters.githubToken }}
      FEED_WAIT_MINUTES: ${{ parameters.feedWaitMinutes }}
      TRUSTED_FEED_HOSTS: ${{ parameters.trustedFeedHosts }}
      NUGET_FEED_READ_TOKEN: $(System.AccessToken)     # sent only to Azure Artifacts hosts
      ${{ if parameters.npmAuthenticate }}:
        NPM_CONFIG_USERCONFIG: ${{ parameters.npmrcFile }}
      ${{ else }}:
        NPM_TOKEN: ${{ parameters.npmToken }}
