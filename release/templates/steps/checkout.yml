# Full history and tags: versions are compared with release tags. Pinning 'self' to 's' keeps the project in
# $(Build.SourcesDirectory) despite the second checkout; the toolkit lands in $(Pipeline.Workspace)/toolkit.

parameters:
  - name: toolkitRepository        # the alias under resources.repositories in the consuming pipeline
    type: string
    default: toolkit
  - name: persistCredentials
    type: boolean
    default: false

steps:
  - checkout: self
    path: s
    fetchDepth: 0
    fetchTags: true
    persistCredentials: ${{ parameters.persistCredentials }}

  - checkout: ${{ parameters.toolkitRepository }}
    path: toolkit
    fetchDepth: 1
