# Full history and tags: versions are compared with release tags. Both repositories stay at the agent's own
# multi-checkout paths: with a custom path the agent first moves a clone that isn't there and warns about it.
# The project lands in $(System.DefaultWorkingDirectory) (workspaceRepo), this toolkit in $(Build.SourcesDirectory)/toolkit.

parameters:
  - name: toolkitRepository        # the alias under resources.repositories in the consuming pipeline
    type: string
    default: toolkit
  - name: persistCredentials
    type: boolean
    default: false
  - name: persistToolkitCredentials   # release jobs with useGitHubServiceConnection: keeps the endpoint's token for the scripts
    type: boolean
    default: false

steps:
  - checkout: self
    workspaceRepo: true
    fetchDepth: 0
    fetchTags: true
    persistCredentials: ${{ parameters.persistCredentials }}

  - checkout: ${{ parameters.toolkitRepository }}
    fetchDepth: 1
    persistCredentials: ${{ parameters.persistToolkitCredentials }}
