# Checks out the project (full history and tags: versions are compared with release tags) and this
# toolkit next to it. With two checkouts Azure would move the project to s/<repository name>; pinning
# 'self' to 's' keeps it in $(Build.SourcesDirectory), and the toolkit lands in $(Pipeline.Workspace)/toolkit.

parameters:
  - name: toolkitRepository        # the alias under resources.repositories in the consuming pipeline
    type: string
    default: toolkit
  - name: persistCredentials
    type: boolean
    default: false

steps:
  - checkout: self
    path: s
    fetchDepth: 0
    fetchTags: true
    persistCredentials: ${{ parameters.persistCredentials }}

  - checkout: ${{ parameters.toolkitRepository }}
    path: toolkit
    fetchDepth: 1
