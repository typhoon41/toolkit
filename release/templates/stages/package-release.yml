# Complete pipeline for NuGet/npm packages: Build (every branch and PR, jobs/package-build.yml) and
# Release (only when a unit's version was bumped on the release branch, behind the approval environment,
# jobs/package-publish.yml).
#
# The Build stage holds no publishing secrets. Only the Release stage references releaseVariableGroup
# (NuGetApiKey / NpmToken / GitHubToken); protect it and the environment as described in docs/ADOPTING.md.

parameters:
  - name: buildSteps               # restore/build/test of your projects (install SDKs and Node here)
    type: stepList
    default: []
  - name: releaseNotes
    type: boolean
    default: true
  - name: environment
    type: string
    default: package-release
  - name: releaseVariableGroup
    type: string
    default: release-secrets
  - name: buildVariableGroup       # optional; only a read-only GitHubReadToken (the Build stage runs PR code)
    type: string
    default: ''
  - name: releaseBranch
    type: string
    default: refs/heads/main
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: enforceCommitConvention
    type: boolean
    default: false
  - name: configuration
    type: string
    default: Release
  - name: feedWaitMinutes
    type: number
    default: 15
  - name: nugetAuthenticate
    type: boolean
    default: false
  - name: npmAuthenticate
    type: boolean
    default: false
  - name: npmrcFile
    type: string
    default: $(Build.SourcesDirectory)/.npmrc
  - name: npmAccess
    type: string
    default: ''
  - name: toolkitRepository
    type: string
    default: toolkit

stages:
  - stage: Build
    pool: ${{ parameters.pool }}
    ${{ if ne(parameters.buildVariableGroup, '') }}:
      variables:
        - group: ${{ parameters.buildVariableGroup }}
    jobs:
      - template: ../jobs/package-build.yml
        parameters:
          buildSteps: ${{ parameters.buildSteps }}
          releaseNotes: ${{ parameters.releaseNotes }}
          releaseBranch: ${{ parameters.releaseBranch }}
          enforceCommitConvention: ${{ parameters.enforceCommitConvention }}
          configuration: ${{ parameters.configuration }}
          toolkitRepository: ${{ parameters.toolkitRepository }}

  - stage: Release
    dependsOn: Build
    condition: and(succeeded(), eq(dependencies.Build.outputs['BuildJob.ReleasePlan.HasRelease'], 'true'))
    pool: ${{ parameters.pool }}
    variables:
      - group: ${{ parameters.releaseVariableGroup }}
    jobs:
      - template: ../jobs/package-publish.yml
        parameters:
          environment: ${{ parameters.environment }}
          feedWaitMinutes: ${{ parameters.feedWaitMinutes }}
          nugetAuthenticate: ${{ parameters.nugetAuthenticate }}
          npmAuthenticate: ${{ parameters.npmAuthenticate }}
          npmrcFile: ${{ parameters.npmrcFile }}
          npmAccess: ${{ parameters.npmAccess }}
          toolkitRepository: ${{ parameters.toolkitRepository }}
