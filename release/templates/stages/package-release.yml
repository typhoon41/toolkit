# Complete pipeline for NuGet/npm packages: Build (every branch and PR) and Release (only when a unit's
# version was bumped on the release branch, behind the approval environment).
#
#   Build    checkout -> PR convention check -> release plan -> your build/test steps -> release notes
#            (optional) -> pack -> publish the 'release' artifact (plan, notes, packages)
#   Release  approval -> Prepare GitHub drafts -> push NuGet/npm -> publish GitHub releases and tags
#
# The Build stage holds no publishing secrets. Only the Release stage references releaseVariableGroup
# (NuGetApiKey / NpmToken / GitHubToken); protect it and the environment as described in docs/ADOPTING.md.

parameters:
  - name: buildSteps               # restore/build/test of your projects (install SDKs and Node here)
    type: stepList
    default: []
  - name: releaseNotes
    type: boolean
    default: true
  - name: environment
    type: string
    default: package-release
  - name: releaseVariableGroup
    type: string
    default: release-secrets
  - name: buildVariableGroup       # optional; e.g. a group holding GitHubReadToken
    type: string
    default: ''
  - name: releaseBranch
    type: string
    default: refs/heads/main
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: enforceCommitConvention
    type: boolean
    default: false
  - name: configuration
    type: string
    default: Release
  - name: nugetAuthenticate
    type: boolean
    default: false
  - name: npmAuthenticate
    type: boolean
    default: false
  - name: npmrcFile
    type: string
    default: $(Build.SourcesDirectory)/.npmrc
  - name: npmAccess
    type: string
    default: ''
  - name: toolkitRepository
    type: string
    default: toolkit

stages:
  - stage: Build
    pool: ${{ parameters.pool }}
    ${{ if ne(parameters.buildVariableGroup, '') }}:
      variables:
        - group: ${{ parameters.buildVariableGroup }}
    jobs:
      - job: BuildJob
        steps:
          - template: ../steps/checkout.yml
            parameters:
              toolkitRepository: ${{ parameters.toolkitRepository }}

          - template: ../steps/validate-pull-request.yml
            parameters:
              enforce: ${{ parameters.enforceCommitConvention }}

          - template: ../steps/resolve-release-plan.yml
            parameters:
              releaseBranch: ${{ parameters.releaseBranch }}

          - ${{ each step in parameters.buildSteps }}:
            - ${{ step }}

          - ${{ if parameters.releaseNotes }}:
            - template: ../steps/release-notes.yml

          - template: ../steps/pack.yml
            parameters:
              configuration: ${{ parameters.configuration }}

          - publish: $(Build.ArtifactStagingDirectory)/release
            artifact: release
            displayName: Publish release artifact

  - stage: Release
    dependsOn: Build
    condition: and(succeeded(), eq(dependencies.Build.outputs['BuildJob.ReleasePlan.HasRelease'], 'true'))
    pool: ${{ parameters.pool }}
    variables:
      - group: ${{ parameters.releaseVariableGroup }}
    jobs:
      - deployment: Publish
        displayName: Publish packages and GitHub releases
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: ../steps/checkout.yml       # same commit; tags are fetched after the approval
                  parameters:
                    toolkitRepository: ${{ parameters.toolkitRepository }}

                - download: current
                  artifact: release
                  displayName: Download release artifact

                # Every step below is safe to re-run with "Rerun failed jobs" on THIS run.
                - template: ../steps/publish-github-release.yml
                  parameters:
                    action: Prepare

                - template: ../steps/publish-packages.yml
                  parameters:
                    nugetAuthenticate: ${{ parameters.nugetAuthenticate }}
                    npmAuthenticate: ${{ parameters.npmAuthenticate }}
                    npmrcFile: ${{ parameters.npmrcFile }}
                    npmAccess: ${{ parameters.npmAccess }}

                - template: ../steps/publish-github-release.yml
                  parameters:
                    action: Publish
