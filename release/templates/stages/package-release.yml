# NuGet/npm pipeline: Build on every branch and PR; Release only when a version bump reaches the release branch.
# Only Release references releaseVariableGroup: protect it and the environment (docs/ADOPTING.md). The Release
# stage takes the environment's exclusive lock in order (lockBehavior), so releases never overlap.

parameters:
  - name: buildSteps               # restore/build/test of your projects
    type: stepList
    default: []
  - name: nodeVersion              # e.g. 22.x: installed with UseNode@1 before buildSteps
    type: string
    default: ''
  - name: dotnetVersion            # e.g. 10.x: the .NET SDK installed with UseDotNet@2 before buildSteps
    type: string
    default: ''
  - name: releaseNotes
    type: boolean
    default: true
  - name: environment
    type: string
    default: package-release
  - name: releaseVariableGroup     # NuGetApiKey / NpmToken / GitHubToken, when service connections don't replace them
    type: string
    default: ''
  - name: buildVariableGroup       # optional; only a read-only GitHubReadToken (the Build stage runs PR code)
    type: string
    default: ''
  - name: releaseBranch
    type: string
    default: refs/heads/main
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: enforceCommitConvention
    type: boolean
    default: true
  - name: configuration
    type: string
    default: Release
  - name: feedWaitMinutes
    type: number
    default: 15
  - name: nugetAuthenticate
    type: boolean
    default: false
  - name: npmAuthenticate
    type: boolean
    default: false
  - name: npmServiceConnection     # npm service connection used instead of NpmToken (needs a committed .npmrc)
    type: string
    default: ''
  - name: npmrcFile
    type: string
    default: $(System.DefaultWorkingDirectory)/.npmrc
  - name: npmAccess
    type: string
    default: ''
  - name: useGitHubServiceConnection   # the toolkit resource's endpoint connection instead of GitHubToken (release job only)
    type: boolean
    default: true
  - name: trustedFeedHosts         # comma-separated extra feed hosts that may get NuGetApiKey / NpmToken
    type: string
    default: ''
  - name: toolkitRepository
    type: string
    default: toolkit

stages:
  - stage: Build
    pool: ${{ parameters.pool }}
    ${{ if ne(parameters.buildVariableGroup, '') }}:
      variables:
        - group: ${{ parameters.buildVariableGroup }}
    jobs:
      - template: ../jobs/package-build.yml
        parameters:
          buildSteps: ${{ parameters.buildSteps }}
          nodeVersion: ${{ parameters.nodeVersion }}
          dotnetVersion: ${{ parameters.dotnetVersion }}
          releaseNotes: ${{ parameters.releaseNotes }}
          releaseBranch: ${{ parameters.releaseBranch }}
          enforceCommitConvention: ${{ parameters.enforceCommitConvention }}
          configuration: ${{ parameters.configuration }}
          toolkitRepository: ${{ parameters.toolkitRepository }}

  - stage: Release
    dependsOn: Build
    lockBehavior: sequential
    condition: and(succeeded(), eq(dependencies.Build.outputs['BuildJob.ReleasePlan.HasRelease'], 'true'))
    pool: ${{ parameters.pool }}
    ${{ if ne(parameters.releaseVariableGroup, '') }}:   # '' when service connections replace every secret
      variables:
        - group: ${{ parameters.releaseVariableGroup }}
    jobs:
      - template: ../jobs/package-publish.yml
        parameters:
          environment: ${{ parameters.environment }}
          feedWaitMinutes: ${{ parameters.feedWaitMinutes }}
          nugetAuthenticate: ${{ parameters.nugetAuthenticate }}
          npmAuthenticate: ${{ or(parameters.npmAuthenticate, ne(parameters.npmServiceConnection, '')) }}
          npmServiceConnection: ${{ parameters.npmServiceConnection }}
          npmrcFile: ${{ parameters.npmrcFile }}
          npmAccess: ${{ parameters.npmAccess }}
          useGitHubServiceConnection: ${{ parameters.useGitHubServiceConnection }}
          trustedFeedHosts: ${{ parameters.trustedFeedHosts }}
          toolkitRepository: ${{ parameters.toolkitRepository }}
