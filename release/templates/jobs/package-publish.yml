# Release job of package-release.yml, behind the approval environment. Every step is safe to re-run with
# "Rerun failed jobs".

parameters:
  - name: environment
    type: string
    default: package-release
  - name: feedWaitMinutes
    type: number
    default: 15
  - name: nugetAuthenticate
    type: boolean
    default: false
  - name: npmAuthenticate          # true with npmServiceConnection too: every npm step then uses npmrcFile
    type: boolean
    default: false
  - name: npmServiceConnection
    type: string
    default: ''
  - name: npmrcFile
    type: string
    default: $(Build.SourcesDirectory)/.npmrc
  - name: npmAccess
    type: string
    default: ''
  - name: useGitHubServiceConnection
    type: boolean
    default: true
  - name: trustedFeedHosts
    type: string
    default: ''
  - name: toolkitRepository
    type: string
    default: toolkit

jobs:
  - deployment: Publish
    displayName: Publish packages and GitHub releases
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - template: ../steps/checkout.yml       # same commit; tags are fetched after the approval
              parameters:
                toolkitRepository: ${{ parameters.toolkitRepository }}
                persistToolkitCredentials: ${{ parameters.useGitHubServiceConnection }}

            - download: current
              artifact: release
              displayName: Download release artifact

            - template: ../steps/authenticate-feeds.yml      # before the first feed check (Prepare)
              parameters:
                nugetAuthenticate: ${{ parameters.nugetAuthenticate }}
                npmAuthenticate: ${{ parameters.npmAuthenticate }}
                npmServiceConnection: ${{ parameters.npmServiceConnection }}
                npmrcFile: ${{ parameters.npmrcFile }}

            - template: ../steps/publish-github-release.yml
              parameters:
                action: Prepare
                useGitHubServiceConnection: ${{ parameters.useGitHubServiceConnection }}
                trustedFeedHosts: ${{ parameters.trustedFeedHosts }}
                npmAuthenticate: ${{ parameters.npmAuthenticate }}
                npmrcFile: ${{ parameters.npmrcFile }}

            - template: ../steps/publish-packages.yml
              parameters:
                npmAuthenticate: ${{ parameters.npmAuthenticate }}
                npmrcFile: ${{ parameters.npmrcFile }}
                npmAccess: ${{ parameters.npmAccess }}
                trustedFeedHosts: ${{ parameters.trustedFeedHosts }}

            - template: ../steps/publish-github-release.yml
              parameters:
                action: Publish
                useGitHubServiceConnection: ${{ parameters.useGitHubServiceConnection }}
                trustedFeedHosts: ${{ parameters.trustedFeedHosts }}
                feedWaitMinutes: ${{ parameters.feedWaitMinutes }}
                npmAuthenticate: ${{ parameters.npmAuthenticate }}
                npmrcFile: ${{ parameters.npmrcFile }}
