# Package repository (NuGet and/or npm). Builds every push and PR; releases a unit when a merge to main
# bumps its version, after approval in the 'package-release' environment. GitHub releases use the toolkit
# resource's endpoint connection (useGitHubServiceConnection, on by default).

trigger:
  branches:
    include: [ main ]

pr:
  branches:
    include: [ main ]

resources:
  repositories:
    - repository: toolkit
      type: github
      name: typhoon41/toolkit
      endpoint: github-connection  # your GitHub service connection

stages:
  - template: release/templates/stages/package-release.yml@toolkit
    parameters:
      releaseVariableGroup: release-secrets   # NuGetApiKey and NpmToken
      buildVariableGroup: build-read          # holds GitHubReadToken; remove for public repositories
      dotnetVersion: 10.x
      nodeVersion: 22.x
      buildSteps:
        - pwsh: dotnet build -c Release
          displayName: Build
        - pwsh: dotnet test -c Release --no-build
          displayName: Test
